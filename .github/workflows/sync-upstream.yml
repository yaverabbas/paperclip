name: Sync Upstream

on:
  schedule:
      - cron: '0 3 * * 1'
        workflow_dispatch:

        jobs:
          sync:
              runs-on: ubuntu-latest
                  steps:
                        - name: Checkout fork
                                uses: actions/checkout@v4
                                        with:
                                                  fetch-depth: 0
                                                            token: ${{ secrets.GITHUB_TOKEN }}

                                                                  - name: Add upstream remote
                                                                          run: |
                                                                                    git remote add upstream https://github.com/paperclipai/paperclip.git || true
                                                                                              git fetch upstream

                                                                                                    - name: Merge upstream main
                                                                                                            run: |
                                                                                                                      git config user.email "github-actions[bot]@users.noreply.github.com"
                                                                                                                                git config user.name "github-actions[bot]"
                                                                                                                                          git checkout main
                                                                                                                                                    git merge upstream/main --no-edit -m "chore: sync upstream paperclip $(date +%Y-%m-%d)" || true
                                                                                                                                                    
                                                                                                                                                          - name: Push if changed
                                                                                                                                                                  run: |
                                                                                                                                                                            if [ "$(git rev-parse HEAD)" != "$(git rev-parse ORIG_HEAD 2>/dev/null || echo '')" ]; then
                                                                                                                                                                                        git push origin main
                                                                                                                                                                                                  else
                                                                                                                                                                                                              echo "No changes to push"
                                                                                                                                                                                                                        fi
                                                                                                                                                                                                                        
                                                                                                                                                                                                                              - name: Report conflicts
                                                                                                                                                                                                                                      if: failure()
                                                                                                                                                                                                                                              run: |
                                                                                                                                                                                                                                                        echo "::error::Merge conflict detected. Resolve manually and push."
                                                                                                                                                                                                                                                                  git merge --abort || true
